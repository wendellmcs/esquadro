<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="titulo desc">
  <title id="titulo">esquadro</title>
  <desc id="desc">O agente prova em vez de afirmar. Ao lado, trechos literais da mensagem do portão de fecho: você afirmou sucesso e não colou evidência desta rodada; rode, ou declare.</desc>
  <defs>
    <pattern id="grade" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E7E3D8" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="20" fill="#FBFAF6"/>
  <rect width="1280" height="400" rx="20" fill="url(#grade)"/>

  <!-- o esquadro: régua em L com marcas de medida e o visto de conferido -->
  <g transform="translate(72 72)">
    <path d="M0 0H56V200H232V256H0Z" fill="#1F2937"/>
    <g stroke="#FBFAF6" stroke-width="3" stroke-linecap="round">
      <path d="M56 24h-14M56 48h-9M56 72h-14M56 96h-9M56 120h-14M56 144h-9M56 168h-14"/>
      <path d="M80 200v-14M104 200v-9M128 200v-14M152 200v-9M176 200v-14M200 200v-9"/>
    </g>
    <path d="M56 176H80V200" fill="none" stroke="#B45309" stroke-width="4"/>
    <circle cx="160" cy="96" r="40" fill="#B45309"/>
    <path d="M142 97l12 12l24-26" fill="none" stroke="#FBFAF6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="344" y="186" font-size="96" font-weight="700" letter-spacing="-3" fill="#111827">esquadro</text>
    <text x="348" y="240" font-size="31" fill="#374151">o agente prova em vez de afirmar</text>
  </g>
  <text x="349" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#6B7280">hooks do Claude Code · zero token</text>

  <!-- o portão: linhas literais do scripts/portao-fecho.js -->
  <g transform="translate(868 100)">
    <rect width="348" height="200" rx="12" fill="#FFFFFF" stroke="#E5E1D6" stroke-width="1.5"/>
    <rect x="0" y="0" width="5" height="200" rx="2" fill="#B45309"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
      <text x="24" y="40" fill="#B45309" font-weight="700">portao de fecho (trava 3)</text>
      <text x="24" y="80" fill="#1F2937">Voce afirmou sucesso e nao</text>
      <text x="24" y="102" fill="#1F2937">colou evidencia desta rodada.</text>
      <text x="24" y="146" fill="#6B7280">Nao reescreva a frase para</text>
      <text x="24" y="168" fill="#6B7280">escapar do portao. Rode, ou declare.</text>
    </g>
  </g>
</svg>
